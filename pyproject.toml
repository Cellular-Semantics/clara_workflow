[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clara_workflow"
version = "0.0.1"
description = "Agentic replication of the CLARA ontology-term verification workflow."
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clara_workflow*"]

[project.urls]
Repository = "https://github.com/Cellular-Semantics/clara_workflow"
